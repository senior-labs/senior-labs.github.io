<style>
  :root{--acc:#22d3ee;--acc-dim:rgba(34,211,238,.14);--bg1:#0d0f13;--card:#14171d;--card2:#1a1e26;--line:#20252e;--line2:#2d3440;--txt:#e7e9ee;--dim:#8b929e;--red:#f87171}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg1);color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       background-image:radial-gradient(900px 500px at 50% -10%,var(--acc-dim),transparent 70%),linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
       background-size:auto,46px 46px,46px 46px;background-attachment:fixed}
  button{font:inherit;font-weight:600;cursor:pointer;border-radius:11px;border:1px solid var(--line2);background:var(--card);color:var(--txt);padding:11px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.12s}
  button:hover{border-color:var(--acc)}
  button:disabled{opacity:.5;cursor:default}
  button.pri{background:var(--acc);border-color:var(--acc);color:#06252e}
  button.pri:hover{filter:brightness(1.08)}
  button.off{background:rgba(248,113,113,.15);border-color:rgba(248,113,113,.5);color:var(--red)}
  button.leave{background:var(--red);border-color:var(--red);color:#2a0b0b}
  button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  select,input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line2);background:#0f1114;color:var(--txt);font:inherit;font-size:14px}
  select:focus,input:focus{outline:0;border-color:var(--acc)}
  label{display:block;font-size:12.5px;color:var(--dim);margin:14px 0 6px;font-weight:500}
  .brand{display:flex;align-items:center;gap:10px}
  .brand svg{width:44px;height:44px;overflow:visible;margin:-4px -2px -4px -6px;flex:0 0 auto}
  .brand b{font-size:15px;display:block;line-height:1.1}.brand small{color:var(--dim);font-size:11.5px}
  /* Lobby */
  .lobby{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:28px 16px 40px}
  .card{width:100%;max-width:920px;background:rgba(20,23,29,.92);border:1px solid var(--line2);border-radius:18px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.45);margin-top:22px}
  h1{font-size:28px;line-height:1.15;margin:0 0 6px;background:linear-gradient(90deg,#fff,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--dim);margin:0 0 20px}
  .cols{display:grid;grid-template-columns:1.25fr 1fr;gap:26px}
  .prev{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#0b0d10;border:2px solid var(--acc);box-shadow:0 0 26px var(--acc-dim)}
  .prev video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
  .prev .nm{position:absolute;left:12px;bottom:12px;background:rgba(11,13,16,.8);border-left:3px solid var(--acc);padding:4px 10px;border-radius:7px;font-weight:700;font-size:14px}
  .prev .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--dim);font-size:14px}
  .meter{height:6px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:var(--acc);transition:width .08s}
  .tips{margin:16px 0 0;padding:0;list-style:none;color:var(--dim);font-size:13px}
  .tips li{padding-left:22px;position:relative;margin:5px 0}
  .tips li:before{content:'';position:absolute;left:4px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--acc)}
  .joinbtn{width:100%;margin-top:20px;padding:14px;font-size:16px}
  .err{color:var(--red);font-size:13px;margin-top:10px;min-height:1px}
  .foot{color:var(--dim);font-size:12px;margin-top:22px;text-align:center}
  .foot a{color:var(--dim)}
  /* Call */
  .call{position:fixed;inset:0;display:none;flex-direction:column}
  .call .top{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line2);background:rgba(13,15,19,.9)}
  .pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;border:1px solid var(--line2);border-radius:20px;padding:5px 12px;background:var(--card)}
  .pill i{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399}
  .stage{flex:1;position:relative;min-height:0}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .bar{display:flex;justify-content:center;gap:10px;padding:14px;border-top:1px solid var(--line2);background:rgba(13,15,19,.9);flex-wrap:wrap}
  .bar button{min-width:120px}
  .drawer{position:absolute;right:14px;top:14px;bottom:14px;width:330px;max-width:calc(100% - 28px);background:rgba(20,23,29,.97);border:1px solid var(--line2);border-radius:14px;display:none;flex-direction:column;padding:14px;z-index:5}
  .drawer.open{display:flex}
  .msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px}
  .m{background:var(--bg1);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13.5px;word-break:break-word}
  .m b{color:var(--acc);margin-right:6px}
  .send{display:flex;gap:8px;margin-top:10px}.send button{min-width:0}
  .badge{display:inline-block;min-width:8px;height:8px;border-radius:50%;background:var(--acc);margin-left:2px;visibility:hidden}
  .badge.on{visibility:visible}
  /* Ende / Fehler */
  .center{min-height:100%;display:none;align-items:center;justify-content:center;padding:20px}
  .center .card{max-width:480px;text-align:center}
  @media (max-width:760px){.cols{grid-template-columns:1fr}.card{padding:18px}h1{font-size:23px}.bar button{min-width:0;flex:1}.bar button span{display:none}}
  /* Sprache */
  .langsw{position:fixed;top:14px;right:16px;z-index:20;display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:rgba(13,15,19,.85)}
  .langsw button{background:transparent;color:var(--dim);border:0;border-radius:0;padding:6px 11px;font-size:12px;font-weight:700;letter-spacing:.5px}
  .langsw button:hover{border:0;color:var(--txt)}
  .langsw button.on{background:var(--acc-dim);color:var(--acc)}
  /* Hinweis fuer senior-labs-Streamer: deutlich, bevor man automatisch auf "Beitreten" klickt */
  .slb{display:flex;align-items:center;gap:14px;margin:0 0 22px;padding:14px 16px;border:1px solid var(--acc);border-radius:13px;background:linear-gradient(90deg,var(--acc-dim),rgba(34,211,238,.04));text-decoration:none;color:var(--txt);box-shadow:0 0 22px var(--acc-dim);transition:.15s}
  .slb:hover{box-shadow:0 0 30px rgba(34,211,238,.3);transform:translateY(-1px)}
  .slb svg.logo{width:40px;height:40px;flex:0 0 auto;overflow:visible}
  .slb .tx{flex:1;min-width:0}
  .slb .tx b{display:block;font-size:15px}
  .slb .tx small{display:block;color:var(--dim);font-size:12.5px;line-height:1.4;margin-top:2px}
  .slb .go{flex:0 0 auto;background:var(--acc);color:#06252e;font-weight:700;font-size:13.5px;padding:9px 14px;border-radius:10px;white-space:nowrap}
  .or{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12px;margin:-8px 0 16px;text-transform:uppercase;letter-spacing:1.4px}
  .or:before,.or:after{content:'';flex:1;height:1px;background:var(--line2)}
  @media (max-width:760px){.slb{flex-wrap:wrap}.slb .go{width:100%;text-align:center}}
</style>
</head>

<script>
  // Oeffentliche Gastseite von senior-labs. Alle Daten stehen im #Hash des Raum-Links (gehen nie an einen Server):
  //   r=Raum  p=Passwort  s=Streamer  (n=Name vorbelegen, optional)
  // Kennung = 'c' + sha1(raum | normierter Name) - genau wie in senior-labs -> gleicher Name = gleicher Rahmen.
  // VDO.ninja laeuft nur als eingebettetes Iframe; Bedienung ueber die offizielle Iframe-API (postMessage).
  var Q={};location.hash.replace(/^#/,'').split('&').forEach(function(kv){var i=kv.indexOf('=');if(i>0){try{Q[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1));}catch(_){}}});
  var stream=null,raf=0,ifr=null,micOn=true,camOn=true,chatOpen=false,camFail=null,myId='';
  function $(id){return document.getElementById(id);}
  function enc(x){return encodeURIComponent(String(x==null?'':x));}
  function esc(x){return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function show(id){['lobby','call','done'].forEach(function(k){$(k).style.display=(k===id)?'flex':'none';});}

  // ---- Sprache (DE/EN): Browsersprache, Wahl wird gemerkt ----
  var L={
    en:{title:'Join {s} on stream',titleNo:"You're invited to the stream",slQ:'Do you stream with senior-labs yourself?',slTxt:'Then do not join here — open the room in your senior-labs. Your cam runs through your Studio and you land in your own frame.',slGo:'Open in senior-labs →',
      orGuest:'or join as a guest',sub:'Check your camera and microphone, then join. Nothing is sent until you click Join.',
      nameLbl:'Your name <span style="font-weight:400">&mdash; use the same name every time, then you land in the same spot</span>',namePh:'e.g. Peter',camLbl:'Camera',micLbl:'Microphone',
      tip1:'Use <b>headphones</b> &mdash; otherwise the stream hears an echo.',tip2:'You can leave anytime and rejoin with the <b>same link</b> and the <b>same name</b>.',joinBtn:'Join now',
      foot:'Video runs peer-to-peer via <a href="https://vdo.ninja" target="_blank" rel="noopener">VDO.ninja</a> &middot; no account, nothing to install.',
      connected:'Connected',send:'Send',msgPh:'Message…',leave:'Leave',rejoin:'Rejoin',liveWith:'live with {s}',docTitle:'Join {s} · senior-labs',
      micOn:'Mic on',muted:'Muted',camOn:'Cam on',camOff:'Cam off',you:'You',host:'Host',
      allow:'Allow camera & microphone access to see your preview.',audioOnly:'Audio only',noSupport:'Your browser does not support video calls. Please use Chrome, Edge, Firefox or Safari.',
      blocked:'Access was blocked. Click the camera icon in the address bar, allow access and reload.',
      busy1:'The camera is being used by another program (e.g. OBS, Discord, Teams). Close it there — or in OBS click Start Virtual Camera and pick “OBS Virtual Camera” above. Your microphone works anyway.',
      busy2:'Camera or microphone is being used by another program (e.g. OBS, Discord, Teams). Close it there and reload.',

      err1:'The camera could not be started ({n}). Pick another one above or reload the page.',err2:'Camera and microphone could not be started ({n}). Reload the page.',
      noCamOpt:'No camera (audio only)',camN:'Camera {n}',micN:'Microphone {n}',enterName:'Please enter your name.',oldBrowser:'Your browser is too old. Please use a current Chrome, Edge, Firefox or Safari.',cantStart:'Could not start. Please reload the page.',
      leftT:'You left the stream',leftS:'Thanks for joining! You can come back anytime with the same link and name.',

      kickT:'You were removed from the stream',kickS:'The streamer ended your connection. If they invite you again, use the same link and name.',

    de:{title:'Komm zu {s} in den Stream',titleNo:'Du bist zum Stream eingeladen',slQ:'Du streamst selbst mit senior-labs?',slTxt:'Dann tritt nicht hier bei — öffne den Raum in deinem senior-labs. Deine Cam läuft dann über dein Studio und du landest in deinem eigenen Rahmen.',slGo:'In senior-labs öffnen →',
      orGuest:'oder als Gast beitreten',sub:'Prüf Kamera und Mikrofon, dann tritt bei. Erst wenn du auf Beitreten klickst, wird etwas gesendet.',
      nameLbl:'Dein Name <span style="font-weight:400">&mdash; nimm jedes Mal denselben, dann landest du wieder am selben Platz</span>',namePh:'z. B. Peter',camLbl:'Kamera',micLbl:'Mikrofon',
      tip1:'Nimm <b>Kopfhörer</b> &mdash; sonst hört der Stream ein Echo.',tip2:'Du kannst jederzeit gehen und mit <b>demselben Link</b> und <b>demselben Namen</b> wiederkommen.',joinBtn:'Jetzt beitreten',
      foot:'Video läuft direkt zwischen euch über <a href="https://vdo.ninja" target="_blank" rel="noopener">VDO.ninja</a> &middot; kein Konto, nichts zu installieren.',
      connected:'Verbunden',send:'Senden',msgPh:'Nachricht…',leave:'Verlassen',rejoin:'Wieder beitreten',liveWith:'live mit {s}',docTitle:'Zu {s} in den Stream · senior-labs',
      micOn:'Mikro an',muted:'Stumm',camOn:'Cam an',camOff:'Cam aus',you:'Du',host:'Host',
      allow:'Erlaube den Zugriff auf Kamera & Mikrofon, um deine Vorschau zu sehen.',audioOnly:'Nur Ton',noSupport:'Dein Browser unterstützt keine Videoanrufe. Bitte nimm Chrome, Edge, Firefox oder Safari.',
      blocked:'Der Zugriff wurde blockiert. Klick auf das Kamera-Symbol in der Adressleiste, erlaube den Zugriff und lade neu.',
      busy1:'Die Kamera wird gerade von einem anderen Programm benutzt (z. B. OBS, Discord, Teams). Schließ sie dort — oder klick in OBS auf „Virtuelle Kamera starten“ und wähl oben „OBS Virtual Camera“. Dein Mikrofon funktioniert trotzdem.',
      busy2:'Kamera oder Mikrofon werden gerade von einem anderen Programm benutzt (z. B. OBS, Discord, Teams). Schließ sie dort und lade neu.',
      nf1:'Diese Kamera wurde nicht gefunden. Wähl oben eine andere oder prüf das Kabel.',nf2:'Keine Kamera und kein Mikrofon gefunden. Prüf das Kabel und lade neu.',
      err1:'Die Kamera ließ sich nicht starten ({n}). Wähl oben eine andere oder lade die Seite neu.',err2:'Kamera und Mikrofon ließen sich nicht starten ({n}). Lade die Seite neu.',
      noCamOpt:'Keine Kamera (nur Ton)',camN:'Kamera {n}',micN:'Mikrofon {n}',enterName:'Bitte gib deinen Namen ein.',oldBrowser:'Dein Browser ist zu alt. Bitte nimm einen aktuellen Chrome, Edge, Firefox oder Safari.',cantStart:'Start fehlgeschlagen. Bitte lade die Seite neu.',
      leftT:'Du hast den Stream verlassen',leftS:'Danke fürs Mitmachen! Mit demselben Link und Namen kannst du jederzeit wiederkommen.',
      badT:'Dieser Raum-Link ist unvollständig',badS:'Bitte lass dir den Link noch einmal vom Streamer schicken.',
      kickT:'Du wurdest aus dem Stream entfernt',kickS:'Der Streamer hat deine Verbindung beendet. Wenn er dich wieder einlädt, nimm denselben Link und Namen.',
      mutedBy:'Der Host hat dein Mikrofon stummgeschaltet. Klick auf Mikro, um es wieder einzuschalten.'}
  };
  var lang='en';try{lang=localStorage.getItem('sl-lang')||'';}catch(_){}
  if(lang!=='de'&&lang!=='en')lang=/^de/i.test(navigator.language||'')?'de':'en';
  function T(k,v){var s=(L[lang]&&L[lang][k])||L.en[k]||k;if(v)Object.keys(v).forEach(function(n){s=s.split('{'+n+'}').join(v[n]);});return s;}
  // Text setzen und Schluessel merken -> beim Sprachwechsel neu uebersetzbar
  function setT(el,k,v){if(typeof el==='string')el=$(el);el.setAttribute('data-k',k);el._v=v;el.textContent=T(k,v);}
  function applyLang(){
    document.documentElement.lang=lang;
    document.querySelectorAll('[data-l]').forEach(function(el){var t=T(el.getAttribute('data-l'));if(el.hasAttribute('data-html'))el.innerHTML=t;else el.textContent=t;});
    document.querySelectorAll('[data-k]').forEach(function(el){el.textContent=T(el.getAttribute('data-k'),el._v);});
    $('name').placeholder=T('namePh');$('chatIn').placeholder=T('msgPh');
    var st=(Q.s||'').trim();setT('hTitle',st?'title':'titleNo',{s:st});
    if(st){setT('callWith','liveWith',{s:st});document.title=T('docTitle',{s:st});}
    document.querySelectorAll('#langSw [data-lang]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-lang')===lang);});
    paint();devices();
  }
  $('langSw').addEventListener('click',function(e){var b=e.target.closest('[data-lang]');if(!b)return;lang=b.getAttribute('data-lang');try{localStorage.setItem('sl-lang',lang);}catch(_){}applyLang();});

  var saved='';try{saved=localStorage.getItem('sl-join-name')||'';}catch(_){}
  $('name').value=Q.n||saved;$('prevName').textContent=$('name').value;
  $('name').addEventListener('input',function(){$('prevName').textContent=this.value;});
  // senior-labs-Nutzer: Raum im eigenen senior-labs oeffnen (dort Rueckfrage, danach Studio)
  $('slOpen').href='http://127.0.0.1:8790/join-room'+location.hash;
  setT('prevMsg','allow');

  // ---- Lobby: Vorschau, Geraete, Pegel ----
  function stop(){if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}cancelAnimationFrame(raf);$('meter').style.width='0';}
  function start(){
    stop();var cv=$('cam').value,mv=$('mic').value;
    var c={video:cv==='none'?false:(cv?{deviceId:{exact:cv}}:{width:{ideal:1280},height:{ideal:720}}),audio:mv?{deviceId:{exact:mv}}:true};
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setT('prevMsg','noSupport');return;}
    camFail=null;
    // Kamera und Mikro getrennt versuchen: ist die Kamera belegt (z. B. von OBS), soll wenigstens das Mikro laufen
    navigator.mediaDevices.getUserMedia(c).catch(function(e){
      if(!c.video||!c.audio||(e&&e.name==='NotAllowedError'))throw e;
      return navigator.mediaDevices.getUserMedia({audio:c.audio,video:false}).then(function(s){camFail=e;return s;});
    }).then(function(s){
      stream=s;$('prev').srcObject=s;var hasV=s.getVideoTracks().length>0;
      $('prevMsg').style.display=hasV?'none':'flex';
      if(camFail)camMsg(camFail);else setT('prevMsg','audioOnly');
      meter(s);devices();$('err').textContent='';
    }).catch(function(e){
      $('prevMsg').style.display='flex';camMsg(e,true);
      devices();
    });
  }
  // verstaendliche Meldung je nach Fehler
  function camMsg(e,both){
    var n=e&&e.name||'';
    if(n==='NotAllowedError'||n==='SecurityError')return setT('prevMsg','blocked');
    if(n==='NotReadableError'||n==='TrackStartError'||n==='AbortError')return setT('prevMsg',both?'busy2':'busy1');
    if(n==='OverconstrainedError'||n==='NotFoundError')return setT('prevMsg',both?'nf2':'nf1');
    setT('prevMsg',both?'err2':'err1',{n:n||'?'});
  }
  function meter(s){
    if(!s.getAudioTracks().length)return;
    try{var ac=new (window.AudioContext||window.webkitAudioContext)(),an=ac.createAnalyser();an.fftSize=512;ac.createMediaStreamSource(s).connect(an);var buf=new Uint8Array(an.fftSize);
      (function tick(){an.getByteTimeDomainData(buf);var m=0;for(var i=0;i<buf.length;i++){var v=Math.abs(buf[i]-128);if(v>m)m=v;}$('meter').style.width=Math.min(100,m*1.6)+'%';raf=requestAnimationFrame(tick);})();
    }catch(_){}
  }
  function devices(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.enumerateDevices)return;
    navigator.mediaDevices.enumerateDevices().then(function(ds){
      var cs=$('cam'),ms=$('mic'),cv=cs.value,mv=ms.value;
      var cams=ds.filter(function(d){return d.kind==='videoinput';}),mics=ds.filter(function(d){return d.kind==='audioinput';});
      cs.innerHTML=cams.map(function(d,i){return '<option value="'+esc(d.deviceId)+'" data-dl="'+esc(d.label)+'">'+esc(d.label||T('camN',{n:i+1}))+'</option>';}).join('')+'<option value="none">'+esc(T('noCamOpt'))+'</option>';
      ms.innerHTML=mics.map(function(d,i){return '<option value="'+esc(d.deviceId)+'" data-dl="'+esc(d.label)+'">'+esc(d.label||T('micN',{n:i+1}))+'</option>';}).join('');
      var vt=stream&&stream.getVideoTracks()[0],at=stream&&stream.getAudioTracks()[0];
      cs.value=cv&&cs.querySelector('option[value="'+cv+'"]')?cv:(vt&&vt.getSettings().deviceId)||cs.value;
      ms.value=mv&&ms.querySelector('option[value="'+mv+'"]')?mv:(at&&at.getSettings().deviceId)||ms.value;
    });
  }
  $('cam').addEventListener('change',start);$('mic').addEventListener('change',start);

  // ---- Call ----
  function lbl(sel){var o=sel.options[sel.selectedIndex];return o?(o.getAttribute('data-dl')||'').replace(/ /g,'_'):'';}   // nur echte Geraetenamen, sonst waehlt VDO.ninja selbst
  function norm(n){return String(n||'').normalize('NFC').toLowerCase().replace(/\s+/g,'').slice(0,40);}
  function pid(room,name){
    var data=new TextEncoder().encode(String(room).toLowerCase()+'|'+norm(name));
    return crypto.subtle.digest('SHA-1',data).then(function(b){var h='';new Uint8Array(b).forEach(function(x){h+=('0'+x.toString(16)).slice(-2);});return 'c'+h.slice(0,15);});
  }
  function join(){
    var name=($('name').value||'').trim().slice(0,40);if(!norm(name)){setT('err','enterName');$('name').focus();return;}
    if(!window.crypto||!crypto.subtle||!window.TextEncoder){setT('err','oldBrowser');return;}
    try{localStorage.setItem('sl-join-name',name);}catch(_){}
    $('joinBtn').disabled=true;
    pid(Q.r,name).then(function(id){$('joinBtn').disabled=false;start2(name,id);},function(){$('joinBtn').disabled=false;setT('err','cantStart');});
  }
  function start2(name,id){
    myId=id;
    var noCam=$('cam').value==='none'||!!camFail,camL=noCam?'0':lbl($('cam')),micL=lbl($('mic'));
    stop();micOn=true;camOn=!noCam;
    var u='https://vdo.ninja/?room='+enc(Q.r)+(Q.p?'&password='+enc(Q.p):'')+'&push='+enc(id)+'&label='+enc(name)
      +'&webcam&autostart&cleanoutput&transparent'+(camL?'&videodevice='+enc(camL):'')+(micL?'&audiodevice='+enc(micL):'');
    ifr=document.createElement('iframe');ifr.setAttribute('allow','camera *; microphone *; autoplay; fullscreen; display-capture');ifr.src=u;
    $('stage').insertBefore(ifr,$('drawer'));$('bCam').disabled=noCam;paint();show('call');
  }
  function post(m){try{ifr.contentWindow.postMessage(m,'*');}catch(_){}}
  function toggleMic(){micOn=!micOn;post({mic:micOn});paint();}
  function toggleCam(){post({camera:'toggle'});camOn=!camOn;paint();}
  function paint(){var a=$('bMic'),c=$('bCam');a.classList.toggle('off',!micOn);a.querySelector('span').textContent=T(micOn?'micOn':'muted');c.classList.toggle('off',!camOn);c.querySelector('span').textContent=T(camOn?'camOn':'camOff');}
  function leave(){if(ifr){post({close:true});var f=ifr;ifr=null;setTimeout(function(){f.remove();},400);}setT('doneTitle','leftT');setT('doneSub','leftS');show('done');}
  function toggleChat(){chatOpen=!chatOpen;$('drawer').classList.toggle('open',chatOpen);if(chatOpen){$('chatBadge').classList.remove('on');$('chatIn').focus();}}
  function addMsg(who,t){var d=document.createElement('div');d.className='m';d.innerHTML='<b>'+esc(who)+'</b>'+esc(t);$('msgs').appendChild(d);$('msgs').scrollTop=1e9;if(!chatOpen)$('chatBadge').classList.add('on');}
  function sendChat(){var i=$('chatIn'),v=i.value.trim();if(!v||!ifr)return;post({sendChat:v});addMsg(T('you'),v);i.value='';}
  $('chatIn').addEventListener('keydown',function(e){if(e.key==='Enter')sendChat();});
  // Steuerbefehle aus dem senior-labs-Studio: unsichtbare Chat-Nachricht "SLCMD <befehl> <kennung>"
  function onCmd(t){
    var p=String(t).split(' ');if(p[2]!==myId)return;
    if(p[1]==='mute'&&micOn){post({mic:false});micOn=false;paint();addMsg('senior-labs',T('mutedBy'));}
    else if(p[1]==='kick'){leave();setT('doneTitle','kickT');setT('doneSub','kickS');}
  }
  window.addEventListener('message',function(e){if(!ifr||e.source!==ifr.contentWindow)return;var d=e.data;if(d&&typeof d==='object'&&d.gotChat){var m=d.gotChat.msg||'';if(String(m).indexOf('SLCMD ')===0){onCmd(m);return;}addMsg(d.gotChat.label||d.gotChat.name||T('host'),m);}});
  window.addEventListener('beforeunload',function(){if(ifr)post({close:true});});

  applyLang();
  if(!Q.r||!/^[A-Za-z0-9_]{4,40}$/.test(Q.r)){
    setT('doneTitle','badT');setT('doneSub','badS');
    document.querySelector('#done button').style.display='none';show('done');
  }else{show('lobby');start();}
</script>
